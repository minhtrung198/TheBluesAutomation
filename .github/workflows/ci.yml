name: .NET CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TheBluesAutomation.csproj

      - name: Build
        run: dotnet build TheBluesAutomation.csproj --no-restore

      - name: Install Chocolatey
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

      - name: Install Google Chrome
        run: choco install googlechrome -y --version=138.0.7204.158

      - name: Test
        run: dotnet test TheBluesAutomation.csproj --no-build --verbosity normal

  deploy:
    needs: build  
    runs-on: windows-latest
    if: github.ref == 'refs/heads/develop'  

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish TheBluesAutomation.csproj -c Release -o out