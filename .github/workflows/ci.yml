name: .NET CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TheBluesAutomation.csproj

      - name: Build
        run: dotnet build TheBluesAutomation.csproj --no-restore

      - name: Install Chocolatey
        run: |
          powershell -Command "Set-ExecutionPolicy Bypass -Scope CurrentUser -Force; iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))"

      - name: Install Google Chrome
        run: choco install googlechrome -y --ignore-checksums 

      - name: Install ChromeDriver
        run: choco install chromedriver -y --version=138.0.7204.157  # Đảm bảo phiên bản khớp Chrome

      - name: Test
        run: dotnet test TheBluesAutomation.csproj --no-build --verbosity normal --filter "FullyQualifiedName~TheBluesAutomation.Tests.HomeTests"

